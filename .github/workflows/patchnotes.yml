name: Patch notes

# Every 5 minutes: check the Gale profile. Most runs end there (a few seconds, no AI).
# When mods change: write the patch note, let Claude write the highlights, push, post to Discord.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # alerts are opened as issues, which GitHub emails to the repo owner

concurrency:
  group: patchnotes
  cancel-in-progress: false

env:
  # When the CLAUDE_CODE_OAUTH_TOKEN secret stops working (YYYY-MM-DD). Kept as the secret
  # CLAUDE_CODE_OAUTH_TOKEN_EXPIRES so it's listed right under the token; update both when renewing.
  CLAUDE_TOKEN_EXPIRES: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EXPIRES }}
  # Days before expiry to start warning.
  CLAUDE_TOKEN_WARN_DAYS: "30"

jobs:
  patchnotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and prepare
        id: prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .patchnotes

          # a Gale/Thunderstore outage is a warning, not a failed run: the next run retries
          if ! python3 tools/patchnotes.py check --record > .patchnotes/check.json; then
            echo "::warning::Couldn't reach the Gale profile; will retry next run"
            echo "status=error" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cat .patchnotes/check.json
          status=$(python3 -c 'import json; print(json.load(open(".patchnotes/check.json"))["status"])')
          echo "status=$status" >> "$GITHUB_OUTPUT"

          case "$status" in
            mods-changed|no-baseline)
              args=""
              [ "$status" = no-baseline ] && args="--backfill-days 3"
              if ! python3 tools/patchnotes.py prepare $args > .patchnotes/prepare.json; then
                echo "::warning::prepare failed (a mod site may be down); will retry next run"
                git checkout -- . && git clean -fdq -e .patchnotes
                exit 0
              fi
              cat .patchnotes/prepare.json
              file=$(python3 -c 'import json; print(json.load(open(".patchnotes/prepare.json")).get("patchFile") or "")')
              if [ -n "$file" ]; then
                cp "$file" .patchnotes/original.md
                echo "file=$file" >> "$GITHUB_OUTPUT"
              fi
              ;;
            config-only)
              python3 tools/patchnotes.py prepare > /dev/null || { git checkout -- .; echo "::warning::prepare failed; will retry"; }
              ;;
          esac

      - name: Write highlights with Claude
        id: claude
        if: steps.prep.outputs.file != ''
        continue-on-error: true   # if this fails, simple highlights are filled in below
        timeout-minutes: 10
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FILE: ${{ steps.prep.outputs.file }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret not set; using simple highlights"
            exit 1
          fi
          npm install -g --silent @anthropic-ai/claude-code
          claude -p "Write the highlights for the Quanheim patch note at $FILE.
          First read .claude/skills/quanheim-patchnotes/SKILL.md and follow its step 4 exactly.
          Then read the patch note. The output of prepare is in .patchnotes/prepare.json: it includes the
          notes for framework mods (BepInEx, Jotunn), which aren't quoted in the patch note.
          Only replace _Highlights pending._ between the highlight markers. Don't change anything else in that
          file, don't touch any other file and don't run commands. Reply with one line when done." \
            --allowedTools "Read,Edit" --max-turns 25

      - name: Commit, push and post
        env:
          STATUS: ${{ steps.prep.outputs.status }}
          FILE: ${{ steps.prep.outputs.file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          VALHEIM_PATCH_DISCORD_WEBHOOK_URL: ${{ secrets.VALHEIM_PATCH_DISCORD_WEBHOOK_URL }}
          VALHEIM_PATCH_DISCORD_GROUP_TAG: ${{ secrets.VALHEIM_PATCH_DISCORD_GROUP_TAG }}
        run: |
          push() {
            for i in 1 2 3; do
              git push origin HEAD:main && return 0
              sleep $((i * 5)); git pull --rebase origin main
            done
            return 1
          }
          commit() {   # commit whatever changed, if anything. Any commit also resets the keepalive clock.
            git add -A
            git diff --cached --quiet && return 0
            mkdir -p status && cp .patchnotes/last-check.json status/last-check.json && git add status
            git commit -q -m "$1" && push
          }
          alert() {    # open an issue (GitHub emails it), unless one with the same title is already open
            gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$1" && return 0
            gh issue create --title "$1" --body "$2"$'\n\n'"@$OWNER · [workflow run]($RUN_URL)"
          }

          if [ -n "$FILE" ]; then
            # keeps only the highlights from Claude's edit; fills in simple ones if it wrote none
            python3 tools/patchnotes.py highlights --original .patchnotes/original.md
            n=$(python3 -c 'import json; print(json.load(open(".patchnotes/prepare.json"))["changes"])')
            commit "Patch notes $(basename "$FILE" .md): $n mod changes"
            if [ "$CLAUDE_OUTCOME" = failure ]; then
              alert "Claude couldn't write the patch note highlights" \
                "The latest patch ($FILE) went out with simple, automatic highlights because the Claude step failed.
          The usual cause is an expired or revoked \`CLAUDE_CODE_OAUTH_TOKEN\`. To renew it, run \`claude setup-token\` on your computer, then update the secret under Settings → Secrets and variables → Actions. Check the workflow run log for the exact error. Close this issue once it's fixed."
            fi
          elif [ "$STATUS" = config-only ]; then
            commit "Profile synced: no mod changes"
          fi

          # post anything committed but not yet on Discord (this run's patch, or a failed earlier post)
          unposted=$(python3 -c 'import json; s=json.load(open("modlist.json")); lp=s.get("lastPatch") or {}; print("yes" if lp and not lp["discord"].get("posted") else "")')
          if [ -n "$unposted" ]; then
            if [ -z "$VALHEIM_PATCH_DISCORD_WEBHOOK_URL" ]; then
              echo "::warning::VALHEIM_PATCH_DISCORD_WEBHOOK_URL secret not set; patch not posted"
            elif python3 tools/patchnotes.py post; then
              commit "Record Discord post"
            else
              echo "::warning::Discord post failed; the next run will retry"
              alert "Discord post failed" \
                "The latest patch couldn't be posted to Discord. Every run retries it, and this issue stays open until you close it. If the webhook was deleted or changed, update \`VALHEIM_PATCH_DISCORD_WEBHOOK_URL\` under Settings → Secrets and variables → Actions."
            fi
          fi

          # keepalive: written by check --record only if nothing has been committed for a week
          git add -A
          git diff --cached --quiet || { git commit -q -m "Keepalive: weekly check-in ($STATUS)" && push; }

      - name: Claude token expiry
        run: |
          if [ -z "$CLAUDE_TOKEN_EXPIRES" ]; then
            echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN_EXPIRES isn't set, so token expiry isn't tracked"
            exit 0
          fi
          if ! expires=$(date -ud "$CLAUDE_TOKEN_EXPIRES" +%s 2>/dev/null); then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN_EXPIRES isn't a date; use YYYY-MM-DD"
            exit 0
          fi
          days=$(( ( expires - $(date -u +%s) ) / 86400 ))
          echo "Claude token expires in $days days"   # the date itself is a secret, so logs show it as ***
          [ "$days" -gt "$CLAUDE_TOKEN_WARN_DAYS" ] && exit 0
          title="Renew the Claude token for patch notes (expires $CLAUDE_TOKEN_EXPIRES)"
          gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title" && exit 0
          gh issue create --title "$title" --body "The \`CLAUDE_CODE_OAUTH_TOKEN\` secret expires on **$CLAUDE_TOKEN_EXPIRES** ($days days). After that, patch notes still post, but with simple automatic highlights instead of Claude's.

          To renew:
          1. On your computer, run \`claude setup-token\` and copy the token it prints.
          2. In this repo, go to Settings → Secrets and variables → Actions, edit \`CLAUDE_CODE_OAUTH_TOKEN\` and paste the new token.
          3. On the same page, update \`CLAUDE_CODE_OAUTH_TOKEN_EXPIRES\` to the new expiry date (a year from today, YYYY-MM-DD).
          4. Close this issue.

          @$OWNER · [workflow run]($RUN_URL)"
